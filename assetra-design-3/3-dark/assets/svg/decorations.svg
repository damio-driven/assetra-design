<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" aria-hidden="true">
  <defs>
    <!-- Meandro romano / Greek key pattern -->
    <pattern id="meander" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40 L0 0 L20 0 L20 20 L40 20 L40 40"
            fill="none"
            stroke="rgba(184,150,90,0.4)"
            stroke-width="1"/>
    </pattern>

    <!-- Linea epigrafica animata -->
    <linearGradient id="gold-line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(184,150,90,0)"/>
      <stop offset="50%" style="stop-color:rgba(184,150,90,0.8)"/>
      <stop offset="100%" style="stop-color:rgba(184,150,90,0)"/>
    </linearGradient>

    <!-- Roman diamond pattern -->
    <pattern id="diamond-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z"
            fill="none"
            stroke="rgba(184,150,90,0.15)"
            stroke-width="1"/>
    </pattern>

    <!-- Grain texture SVG -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Decorative corner elements -->
  <g id="corner-ornament-left">
    <line x1="0" y1="0" x2="0" y2="60" stroke="rgba(184,150,90,0.4)" stroke-width="1"/>
    <line x1="0" y1="0" x2="40" y2="0" stroke="rgba(184,150,90,0.4)" stroke-width="1"/>
    <path d="M0 0 L15 15 M0 15 L15 0" stroke="rgba(184,150,90,0.3)" stroke-width="1"/>
  </g>

  <g id="corner-ornament-right">
    <line x1="400" y1="0" x2="400" y2="60" stroke="rgba(184,150,90,0.4)" stroke-width="1"/>
    <line x1="400" y1="0" x2="360" y2="0" stroke="rgba(184,150,90,0.4)" stroke-width="1"/>
    <path d="M400 0 L385 15 M400 15 L385 0" stroke="rgba(184,150,90,0.3)" stroke-width="1"/>
  </g>

  <!-- Horizontal divider with meander -->
  <g id="divider-meander">
    <line x1="0" y1="100" x2="400" y2="100" stroke="rgba(184,150,90,0.4)" stroke-width="1"/>
    <rect x="150" y="85" width="100" height="30" fill="url(#meander)" opacity="0.6"/>
  </g>

  <!-- Vertical column decoration -->
  <g id="column-decoration">
    <line x1="20" y1="0" x2="20" y2="200" stroke="rgba(184,150,90,0.2)" stroke-width="1"/>
    <circle cx="20" cy="40" r="3" fill="rgba(184,150,90,0.4)"/>
    <circle cx="20" cy="80" r="3" fill="rgba(184,150,90,0.4)"/>
    <circle cx="20" cy="120" r="3" fill="rgba(184,150,90,0.4)"/>
    <circle cx="20" cy="160" r="3" fill="rgba(184,150,90,0.4)"/>
  </g>
</svg>
